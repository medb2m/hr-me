<header class="client-header">
  <div class="client-header__brand">
    <a routerLink="/candidat/overview" class="client-header__logo" aria-label="Accueil espace candidat">
      <span class="client-header__logo-mark">
        <img src="/assets/img/al-wassit-logo.png" alt="" />
      </span>
      <span class="client-header__logo-text">Al Wassit <em>Candidat</em></span>
    </a>
  </div>
  <nav class="client-header__nav" aria-label="Raccourcis">
    <a routerLink="/candidat/explore" routerLinkActive="is-active">Explorer</a>
    <a routerLink="/candidat/profile" routerLinkActive="is-active">Profil</a>
  </nav>
  <div class="client-header__actions">
    @if (user(); as u) {
      <div class="ch-user">
        <button
          type="button"
          class="ch-user__trigger"
          (click)="toggleMenu()"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen"
        >
          <span class="ch-avatar" aria-hidden="true"><img [src]="u.avatarUrl || '/assets/img/default-avatar.jpg'" alt="" class="ch-avatar__img" /></span>
          <span class="ch-user__email">{{ u.email }}</span>
          <svg lucideChevronDown [size]="14" class="ch-caret" [class.ch-caret--open]="menuOpen" aria-hidden="true"></svg>
        </button>

        @if (menuOpen) {
          <div class="ch-menu" role="menu">
            <div class="ch-menu__head">
              <span class="ch-avatar ch-avatar--lg" aria-hidden="true"><img [src]="u.avatarUrl || '/assets/img/default-avatar.jpg'" alt="" class="ch-avatar__img" /></span>
              <div class="ch-menu__identity">
                <span class="ch-menu__name">{{ displayName() }}</span>
                <span class="ch-menu__email">{{ u.email }}</span>
              </div>
            </div>
            <div class="ch-menu__divider"></div>
            <a routerLink="/candidat/overview" class="ch-menu__item" role="menuitem" (click)="closeMenu()">
              <svg lucideLayoutGrid [size]="15" aria-hidden="true"></svg> Tableau de bord
            </a>
            <a routerLink="/candidat/profile" class="ch-menu__item" role="menuitem" (click)="closeMenu()">
              <svg lucideUserRound [size]="15" aria-hidden="true"></svg> Mon profil
            </a>
            <a routerLink="/candidat/settings" class="ch-menu__item" role="menuitem" (click)="closeMenu()">
              <svg lucideSettings [size]="15" aria-hidden="true"></svg> Paramètres du compte
            </a>
            <div class="ch-menu__divider"></div>
            <button type="button" class="ch-menu__item ch-menu__item--danger" role="menuitem" (click)="logout()">
              <svg lucideLogOut [size]="15" aria-hidden="true"></svg> Déconnexion
            </button>
          </div>
        }
      </div>
    }
  </div>
</header>
