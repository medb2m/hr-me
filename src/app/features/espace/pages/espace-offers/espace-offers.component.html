<header class="offers-hero">
  <div class="offers-hero-inner">
    <div>
      <span class="eyebrow-light"><svg lucideBriefcase [size]="14" aria-hidden="true"></svg> Offres internationales</span>
      <h1>Des postes qui vous attendent à l'étranger</h1>
      <p>Offres réelles de nos employeurs partenaires — postulez en quelques clics avec votre CV.</p>
    </div>
    <!-- PHOTO : entretien d'embauche / bureau avec vue sur une ville européenne -->
    <div class="img-ph">
      <svg lucideImage [size]="26" aria-hidden="true"></svg>
      <span class="ph-label">PHOTO</span>
      <span class="ph-desc">Entretien professionnel, fenêtre sur une ville européenne</span>
    </div>
  </div>
</header>

<app-offers-catalog detailBase="/espace/offres" />
