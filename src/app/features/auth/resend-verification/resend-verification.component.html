<div class="auth-shell">
  <div class="auth-card">
    <h1>Renvoyer la vérification</h1>
    <p class="lead">Confirmez votre e-mail et mot de passe pour recevoir un nouveau lien.</p>

    @if (errorMsg) {
      <div class="alert alert-error">{{ errorMsg }}</div>
    }
    @if (successMsg) {
      <div class="alert alert-ok">{{ successMsg }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      </div>
      <button class="btn-primary" type="submit" [disabled]="submitting">
        {{ submitting ? 'Envoi…' : 'Renvoyer' }}
      </button>
    </form>

    <div class="links"><a routerLink="/login">← Connexion</a></div>
  </div>
</div>
