<div class="auth-layout">
  <app-auth-visual />
  <div class="auth-panel">
    <a routerLink="/home" class="auth-back">← Accueil</a>
    <div class="auth-card">
      <img src="/assets/img/al-wassit-logo.png" alt="Al Wassit" class="auth-logo" />
      <h1>Renvoyer la vérification</h1>
    <p class="lead">Confirmez votre e-mail et mot de passe pour recevoir un nouveau lien.</p>

    @if (errorMsg) {
      <div class="alert alert-error">{{ errorMsg }}</div>
    }
    @if (successMsg) {
      <div class="alert alert-ok">{{ successMsg }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="vous@exemple.com" />
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="field-control">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password" />
          <button
            type="button"
            class="pw-toggle"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            [attr.aria-pressed]="showPassword">
            @if (showPassword) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>
      <button class="btn-primary" type="submit" [disabled]="submitting">
        {{ submitting ? 'Envoi…' : 'Renvoyer' }}
      </button>
    </form>

    <div class="links"><a routerLink="/login">← Connexion</a></div>
    </div>
  </div>
</div>
