<div class="auth-shell">
  <div class="auth-card">
    <h1>Nouveau mot de passe</h1>
    <p class="lead">Choisissez un mot de passe d’au moins 8 caractères.</p>

    @if (errorMsg) {
      <div class="alert alert-error">{{ errorMsg }}</div>
    }
    @if (successMsg) {
      <div class="alert alert-ok">{{ successMsg }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirm">Confirmation</label>
        <input id="confirm" type="password" formControlName="confirm" autocomplete="new-password" />
      </div>
      <button class="btn-primary" type="submit" [disabled]="submitting">
        {{ submitting ? 'Enregistrement…' : 'Enregistrer' }}
      </button>
    </form>

    <div class="links"><a routerLink="/login">← Connexion</a></div>
  </div>
</div>
