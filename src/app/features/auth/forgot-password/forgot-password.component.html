<div class="auth-layout">
  <app-auth-visual />
  <div class="auth-panel">
    <app-back-button class="auth-back" label="Accueil"></app-back-button>
    <div class="auth-card">
      <img src="/assets/img/al-wassit-logo.png" alt="Al Wassit" class="auth-logo" />
      <h1>Mot de passe oublié</h1>
    <p class="lead">Indiquez votre e-mail ; si un compte existe, un lien sera envoyé.</p>

    @if (msg) {
      <div class="alert alert-ok">{{ msg }}</div>
    }
    @if (errorMsg) {
      <div class="alert alert-error">{{ errorMsg }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="vous@exemple.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="err">E-mail valide requis.</span>
        }
      </div>
      <button class="btn-primary" type="submit" [disabled]="submitting">
        {{ submitting ? 'Envoi…' : 'Envoyer' }}
      </button>
    </form>

    <div class="links"><app-back-button link="/login" label="Connexion"></app-back-button></div>
    </div>
  </div>
</div>
