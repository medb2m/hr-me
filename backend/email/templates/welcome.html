<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome — {{appName}}</title>
</head>
<body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; line-height: 1.5; color: #0f172a; max-width: 520px; margin: 0 auto; padding: 32px 20px;">
  <p>Hi {{userName}},</p>
  <p>Your email is confirmed. You can sign in to <strong>{{appName}}</strong> whenever you’re ready.</p>
  <p style="margin: 28px 0;">
    <a href="{{loginUrl}}" style="display: inline-block; background: #0f766e; color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 8px; font-weight: 600;">Sign in</a>
  </p>
  <p style="word-break: break-all; font-size: 14px; color: #64748b;">Link: <a href="{{loginUrl}}" style="color: #0f766e;">{{loginUrl}}</a></p>
  <p style="margin-top: 32px; font-size: 12px; color: #94a3b8;">— {{appName}} · <a href="mailto:{{supportEmail}}" style="color: #64748b;">{{supportEmail}}</a></p>
</body>
</html>
