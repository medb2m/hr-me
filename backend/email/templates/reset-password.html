<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset your password — {{appName}}</title>
</head>
<body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; line-height: 1.5; color: #0f172a; max-width: 520px; margin: 0 auto; padding: 32px 20px;">
  <p>Hi {{userName}},</p>
  <p>We received a request to reset your <strong>{{appName}}</strong> password. The link below expires in about <strong>{{expiryMinutes}}</strong> minutes.</p>
  <p style="margin: 28px 0;">
    <a href="{{resetUrl}}" style="display: inline-block; background: #0f766e; color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 8px; font-weight: 600;">Set a new password</a>
  </p>
  <p style="word-break: break-all; font-size: 14px; color: #64748b;">Or open: <a href="{{resetUrl}}" style="color: #0f766e;">{{resetUrl}}</a></p>
  <p style="font-size: 14px; color: #64748b;">If you didn’t ask for this, you can ignore this email.</p>
  <p style="margin-top: 32px; font-size: 12px; color: #94a3b8;">— {{appName}} · <a href="mailto:{{supportEmail}}" style="color: #64748b;">{{supportEmail}}</a></p>
</body>
</html>
