<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mot de passe modifié — {{appName}}</title>
</head>
<body style="margin:0; padding:0; background:#f1f5f9; font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;">
  <div style="max-width:560px; margin:0 auto; padding:32px 16px;">
    <div style="background:#ffffff; border:1px solid #e2e8f0; border-bottom:none; border-radius:16px 16px 0 0; padding:28px 32px; text-align:center;">
      <img src="{{logoUrl}}" alt="{{appName}}" style="height:56px; max-width:220px; object-fit:contain;" />
    </div>
    <div style="height:4px; background:#ffd300;"></div>
    <div style="background:#ffffff; padding:36px 32px; border-radius:0 0 16px 16px; box-shadow:0 4px 16px rgba(15,23,42,.08);">
      <h1 style="margin:0 0 8px; font-size:22px; color:#0f172a; font-weight:800;">Mot de passe modifié</h1>
      <p style="margin:0 0 20px; font-size:15px; color:#475569; line-height:1.6;">
        Bonjour {{userName}},<br />
        Le mot de passe de votre compte <strong>{{appName}}</strong> vient d'être modifié.
      </p>
      <div style="background:#fefce8; border:1px solid #fde047; border-radius:12px; padding:14px 18px; font-size:14px; color:#854d0e;">
        Si vous n'êtes pas à l'origine de ce changement, contactez-nous immédiatement à
        <a href="mailto:{{supportEmail}}" style="color:#854d0e; font-weight:700;">{{supportEmail}}</a>.
      </div>
    </div>
    <p style="text-align:center; font-size:12px; color:#94a3b8; margin:24px 0 0;">
      — {{appName}} · <a href="{{homeUrl}}" style="color:#64748b;">{{homeUrl}}</a> · <a href="mailto:{{supportEmail}}" style="color:#64748b;">{{supportEmail}}</a>
    </p>
  </div>
</body>
</html>
